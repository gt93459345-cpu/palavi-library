<script>

/* =====================================================
   GOOGLE APPS SCRIPT WEB APP URL
===================================================== */

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbx7O5oM9ic59fuwmXimo5cCpm9YCrMYR2LccBgA71NfAZ_pqYJAX59b5CCxKZJ-pLQp/exec";


/* =====================================================
   REGISTRATION DATE
===================================================== */

function setRegistrationDate(){

  const today = new Date();

  const year = today.getFullYear();

  const month =
  String(today.getMonth() + 1).padStart(2,"0");

  const day =
  String(today.getDate()).padStart(2,"0");

  document.getElementById("registrationDate").value =
  `${year}-${month}-${day}`;
}


/* =====================================================
   MEMBER NUMBER
   Temporary number shown on form
===================================================== */

function generateMemberNumber(){

  const year = new Date().getFullYear();

  const randomNumber =
  Math.floor(10000 + Math.random() * 90000);

  document.getElementById("memberNumber").value =
  "LIB-" + year + "-" + randomNumber;
}


setRegistrationDate();
generateMemberNumber();


/* =====================================================
   PHOTO PREVIEW
===================================================== */

document.getElementById("photo").addEventListener(
"change",
function(){

  const file = this.files[0];

  if(file){

    const preview =
    document.getElementById("photoPreview");

    preview.src =
    URL.createObjectURL(file);

    preview.style.display = "block";

  }

});


/* =====================================================
   SIGNATURE PREVIEW
===================================================== */

document.getElementById("signature").addEventListener(
"change",
function(){

  const file = this.files[0];

  if(file){

    const preview =
    document.getElementById("signaturePreview");

    preview.src =
    URL.createObjectURL(file);

    preview.style.display = "block";

  }

});


/* =====================================================
   SAME ADDRESS
===================================================== */

document.getElementById("sameAddress").addEventListener(
"change",
function(){

  const fields = [

    [
      "correspondenceAddress1",
      "permanentAddress1"
    ],

    [
      "correspondenceAddress2",
      "permanentAddress2"
    ],

    [
      "correspondenceAddress3",
      "permanentAddress3"
    ],

    [
      "correspondenceDistrict",
      "permanentDistrict"
    ],

    [
      "correspondenceState",
      "permanentState"
    ],

    [
      "correspondencePincode",
      "permanentPincode"
    ]

  ];


  fields.forEach(function(pair){

    const source =
    document.getElementsByName(pair[0])[0];

    const target =
    document.getElementById(pair[1]);


    if(document.getElementById("sameAddress").checked){

      target.value = source.value;

    }
    else{

      target.value = "";

    }

  });

});


/* =====================================================
   BASE64 FILE CONVERTER
===================================================== */

function fileToBase64(file){

  return new Promise(function(resolve,reject){

    if(!file){

      resolve("");

      return;

    }


    const reader = new FileReader();


    reader.onload = function(){

      resolve(reader.result);

    };


    reader.onerror = function(){

      reject(reader.error);

    };


    reader.readAsDataURL(file);

  });

}


/* =====================================================
   FORM SUBMIT
===================================================== */

document.getElementById("membershipForm").addEventListener(
"submit",
async function(event){

  event.preventDefault();


  const form = this;


  const submitButton =
  form.querySelector(".submit-btn");


  submitButton.disabled = true;

  submitButton.textContent =
  "अर्ज सादर होत आहे...";


  try{


    /* =================================================
       FILES
    ================================================= */

    const photoFile =
    document.getElementById("photo").files[0];

    const aadhaarFile =
    document.getElementById("aadhaar").files[0];

    const idProofFile =
    document.getElementById("idProof").files[0];

    const signatureFile =
    document.getElementById("signature").files[0];


    /* =================================================
       CONVERT FILES TO BASE64
    ================================================= */

    const photoBase64 =
    await fileToBase64(photoFile);

    const aadhaarBase64 =
    await fileToBase64(aadhaarFile);

    const idProofBase64 =
    await fileToBase64(idProofFile);

    const signatureBase64 =
    await fileToBase64(signatureFile);


    /* =================================================
       FORM DATA
    ================================================= */

    const formData = {


      /* MEMBER INFORMATION */

      memberNumber:
      document.getElementById("memberNumber").value,

      registrationDate:
      document.getElementById("registrationDate").value,

      fullName:
      form.fullName.value,

      dateOfBirth:
      form.dateOfBirth.value,

      gender:
      form.gender.value,

      mobile:
      form.mobile.value,

      email:
      form.email.value,


      /* CORRESPONDENCE ADDRESS */

      correspondenceAddress1:
      form.correspondenceAddress1.value,

      correspondenceAddress2:
      form.correspondenceAddress2.value,

      correspondenceAddress3:
      form.correspondenceAddress3.value,

      correspondenceDistrict:
      form.correspondenceDistrict.value,

      correspondenceState:
      form.correspondenceState.value,

      correspondencePincode:
      form.correspondencePincode.value,


      /* PERMANENT ADDRESS */

      permanentAddress1:
      form.permanentAddress1.value,

      permanentAddress2:
      form.permanentAddress2.value,

      permanentAddress3:
      form.permanentAddress3.value,

      permanentDistrict:
      form.permanentDistrict.value,

      permanentState:
      form.permanentState.value,

      permanentPincode:
      form.permanentPincode.value,


      /* MEMBERSHIP */

      membershipType:
      form.membershipType.value,

      feeAmount:
      form.feeAmount.value,


      /* DOCUMENTS */

      photo:
      photoBase64,

      aadhaar:
      aadhaarBase64,

      idProof:
      idProofBase64,

      signature:
      signatureBase64

    };


    /* =================================================
       CREATE HIDDEN IFRAME
    ================================================= */

    let iframe =
    document.getElementById("submitFrame");


    if(!iframe){

      iframe =
      document.createElement("iframe");

      iframe.id =
      "submitFrame";

      iframe.name =
      "submitFrame";

      iframe.style.display =
      "none";

      document.body.appendChild(iframe);

    }


    /* =================================================
       CREATE POST FORM
    ================================================= */

    const postForm =
    document.createElement("form");


    postForm.method =
    "POST";


    postForm.action =
    WEB_APP_URL;


    postForm.target =
    "submitFrame";


    postForm.style.display =
    "none";


    /* =================================================
       SEND JSON DATA
    ================================================= */

    const dataInput =
    document.createElement("input");


    dataInput.type =
    "hidden";


    dataInput.name =
    "data";


    dataInput.value =
    JSON.stringify(formData);


    postForm.appendChild(dataInput);


    document.body.appendChild(postForm);


    /* =================================================
       SUBMIT
    ================================================= */

    postForm.submit();


    /* =================================================
       WAIT
    ================================================= */

    setTimeout(function(){


      alert(
        "अर्ज यशस्वीपणे सादर झाला!\n\n" +
        "सभासद क्रमांक : " +
        formData.memberNumber +
        "\n\n" +
        "आपली माहिती Google Sheet मध्ये पाठवली आहे.\n" +
        "कागदपत्रे Google Drive मध्ये सुरक्षितपणे जतन केली आहेत."
      );


      /* RESET */

      form.reset();


      /* DATE + MEMBER NUMBER AGAIN */

      setRegistrationDate();

      generateMemberNumber();


      /* PREVIEW HIDE */

      document.getElementById(
        "photoPreview"
      ).style.display = "none";


      document.getElementById(
        "signaturePreview"
      ).style.display = "none";


      /* BUTTON */

      submitButton.disabled = false;

      submitButton.textContent =
      "अर्ज सादर करा →";


      /* REMOVE POST FORM */

      postForm.remove();


    },5000);


  }
  catch(error){


    console.error(error);


    alert(
      "अर्ज सादर करताना समस्या आली.\n\n" +
      error.message
    );


    submitButton.disabled = false;

    submitButton.textContent =
    "अर्ज सादर करा →";

  }

});

</script>
