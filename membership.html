```html
<script>

document.addEventListener("DOMContentLoaded", function () {

  /* =====================================================
     GOOGLE APPS SCRIPT WEB APP URL
  ===================================================== */

  const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbx7O5oM9ic59fuwmXimo5cCpm9YCrMYR2LccBgA71NfAZ_pqYJAX59b5CCxKZJ-pLQp/exec";


  /* =====================================================
     ELEMENTS
  ===================================================== */

  const form = document.getElementById("membershipForm");

  if (!form) {
    console.error("membershipForm सापडला नाही.");
    return;
  }


  const memberNumber =
    document.getElementById("memberNumber");

  const registrationDate =
    document.getElementById("registrationDate");

  const photo =
    document.getElementById("photo");

  const aadhaar =
    document.getElementById("aadhaar");

  const idProof =
    document.getElementById("idProof");

  const signature =
    document.getElementById("signature");

  const sameAddress =
    document.getElementById("sameAddress");

  const photoPreview =
    document.getElementById("photoPreview");

  const signaturePreview =
    document.getElementById("signaturePreview");


  /* =====================================================
     REGISTRATION DATE
  ===================================================== */

  function setRegistrationDate() {

    const today = new Date();

    const year = today.getFullYear();

    const month =
      String(today.getMonth() + 1).padStart(2, "0");

    const day =
      String(today.getDate()).padStart(2, "0");

    if (registrationDate) {
      registrationDate.value =
        `${year}-${month}-${day}`;
    }
  }


  /* =====================================================
     TEMPORARY MEMBER NUMBER
     Actual number Google Sheet मध्ये Backend देईल
  ===================================================== */

  function generateMemberNumber() {

    const year = new Date().getFullYear();

    const randomNumber =
      Math.floor(10000 + Math.random() * 90000);

    if (memberNumber) {
      memberNumber.value =
        "TEMP-" + year + "-" + randomNumber;
    }
  }


  setRegistrationDate();
  generateMemberNumber();


  /* =====================================================
     PHOTO PREVIEW
  ===================================================== */

  if (photo) {

    photo.addEventListener("change", function () {

      const file = this.files[0];

      if (file && photoPreview) {

        photoPreview.src =
          URL.createObjectURL(file);

        photoPreview.style.display = "block";
      }

    });

  }


  /* =====================================================
     SIGNATURE PREVIEW
  ===================================================== */

  if (signature) {

    signature.addEventListener("change", function () {

      const file = this.files[0];

      if (file && signaturePreview) {

        signaturePreview.src =
          URL.createObjectURL(file);

        signaturePreview.style.display = "block";
      }

    });

  }


  /* =====================================================
     SAME ADDRESS
  ===================================================== */

  if (sameAddress) {

    sameAddress.addEventListener("change", function () {

      const fields = [

        ["correspondenceAddress1", "permanentAddress1"],
        ["correspondenceAddress2", "permanentAddress2"],
        ["correspondenceAddress3", "permanentAddress3"],
        ["correspondenceDistrict", "permanentDistrict"],
        ["correspondenceState", "permanentState"],
        ["correspondencePincode", "permanentPincode"]

      ];


      fields.forEach(function (pair) {

        const source =
          document.getElementsByName(pair[0])[0];

        const target =
          document.getElementById(pair[1]);


        if (!source || !target) return;


        if (sameAddress.checked) {

          target.value = source.value;

        } else {

          target.value = "";

        }

      });

    });

  }


  /* =====================================================
     FILE → BASE64
  ===================================================== */

  function fileToBase64(file) {

    return new Promise(function (resolve, reject) {

      if (!file) {
        resolve("");
        return;
      }

      const reader = new FileReader();

      reader.onload = function () {
        resolve(reader.result);
      };

      reader.onerror = function () {
        reject(reader.error);
      };

      reader.readAsDataURL(file);

    });

  }


  /* =====================================================
     FORM SUBMIT
  ===================================================== */

  form.addEventListener("submit", async function (event) {

    event.preventDefault();


    const submitButton =
      form.querySelector(".submit-btn");


    if (submitButton) {

      submitButton.disabled = true;

      submitButton.textContent =
        "अर्ज सादर होत आहे...";

    }


    try {

      /* =================================================
         FILES
      ================================================= */

      const photoBase64 =
        await fileToBase64(
          photo ? photo.files[0] : null
        );

      const aadhaarBase64 =
        await fileToBase64(
          aadhaar ? aadhaar.files[0] : null
        );

      const idProofBase64 =
        await fileToBase64(
          idProof ? idProof.files[0] : null
        );

      const signatureBase64 =
        await fileToBase64(
          signature ? signature.files[0] : null
        );


      /* =================================================
         FORM DATA
      ================================================= */

      const formData = {

        memberNumber:
          memberNumber ? memberNumber.value : "",

        registrationDate:
          registrationDate ? registrationDate.value : "",

        fullName:
          form.fullName ? form.fullName.value : "",

        dateOfBirth:
          form.dateOfBirth ? form.dateOfBirth.value : "",

        gender:
          form.gender ? form.gender.value : "",

        mobile:
          form.mobile ? form.mobile.value : "",

        email:
          form.email ? form.email.value : "",


        correspondenceAddress1:
          form.correspondenceAddress1 ?
          form.correspondenceAddress1.value : "",

        correspondenceAddress2:
          form.correspondenceAddress2 ?
          form.correspondenceAddress2.value : "",

        correspondenceAddress3:
          form.correspondenceAddress3 ?
          form.correspondenceAddress3.value : "",

        correspondenceDistrict:
          form.correspondenceDistrict ?
          form.correspondenceDistrict.value : "",

        correspondenceState:
          form.correspondenceState ?
          form.correspondenceState.value : "",

        correspondencePincode:
          form.correspondencePincode ?
          form.correspondencePincode.value : "",


        permanentAddress1:
          form.permanentAddress1 ?
          form.permanentAddress1.value : "",

        permanentAddress2:
          form.permanentAddress2 ?
          form.permanentAddress2.value : "",

        permanentAddress3:
          form.permanentAddress3 ?
          form.permanentAddress3.value : "",

        permanentDistrict:
          form.permanentDistrict ?
          form.permanentDistrict.value : "",

        permanentState:
          form.permanentState ?
          form.permanentState.value : "",

        permanentPincode:
          form.permanentPincode ?
          form.permanentPincode.value : "",


        membershipType:
          form.membershipType ?
          form.membershipType.value : "",

        feeAmount:
          form.feeAmount ?
          form.feeAmount.value : "",


        photo:
          photoBase64,

        aadhaar:
          aadhaarBase64,

        idProof:
          idProofBase64,

        signature:
          signatureBase64

      };


      /* =================================================
         HIDDEN IFRAME
      ================================================= */

      let iframe =
        document.getElementById("submitFrame");


      if (!iframe) {

        iframe =
          document.createElement("iframe");

        iframe.id =
          "submitFrame";

        iframe.name =
          "submitFrame";

        iframe.style.display =
          "none";

        document.body.appendChild(iframe);

      }


      /* =================================================
         POST FORM
      ================================================= */

      const postForm =
        document.createElement("form");

      postForm.method = "POST";

      postForm.action =
        WEB_APP_URL;

      postForm.target =
        "submitFrame";

      postForm.style.display =
        "none";


      const dataInput =
        document.createElement("input");

      dataInput.type =
        "hidden";

      dataInput.name =
        "data";

      dataInput.value =
        JSON.stringify(formData);


      postForm.appendChild(dataInput);

      document.body.appendChild(postForm);


      /* =================================================
         SEND
      ================================================= */

      postForm.submit();


      /* =================================================
         WAIT FOR BACKEND
      ================================================= */

      setTimeout(function () {

        alert(
          "अर्ज यशस्वीपणे सादर झाला!\n\n" +
          "आपली माहिती Google Sheet मध्ये पाठवली आहे.\n" +
          "कागदपत्रे Google Drive मध्ये जतन केली आहेत."
        );


        form.reset();

        setRegistrationDate();

        generateMemberNumber();


        if (photoPreview) {
          photoPreview.style.display = "none";
        }

        if (signaturePreview) {
          signaturePreview.style.display = "none";
        }


        if (submitButton) {

          submitButton.disabled = false;

          submitButton.textContent =
            "अर्ज सादर करा →";

        }


        postForm.remove();

      }, 6000);


    } catch (error) {

      console.error(error);

      alert(
        "अर्ज सादर करताना समस्या आली.\n\n" +
        error.message
      );


      if (submitButton) {

        submitButton.disabled = false;

        submitButton.textContent =
          "अर्ज सादर करा →";

      }

    }

  });

});

</script>
```
