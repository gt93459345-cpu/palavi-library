<!DOCTYPE html>
<html lang="mr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>पालवी लायब्ररी | सभासद Login</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:linear-gradient(135deg,#f4f7fb,#eef2ff);
  min-height:100vh;
  padding:20px;
  color:#111827;
}

.login-box{
  width:100%;
  max-width:850px;
  margin:40px auto;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 15px 45px rgba(0,0,0,.12);
}

.logo{
  text-align:center;
  font-size:48px;
}

h1{
  text-align:center;
  margin:5px 0;
  font-size:27px;
}

.subtitle{
  text-align:center;
  color:#6b7280;
  margin-bottom:25px;
}

.login-form{
  max-width:430px;
  margin:auto;
}

label{
  display:block;
  margin:15px 0 7px;
  font-weight:bold;
  color:#374151;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #d7dce2;
  border-radius:10px;
  font-size:15px;
  font-family:inherit;
  outline:none;
}

textarea{
  min-height:90px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.10);
}

.login-btn,
.action-btn{
  width:100%;
  margin-top:20px;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.login-btn:hover,
.action-btn:hover{
  background:#1d4ed8;
}

.login-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  margin-top:18px;
  padding:12px;
  border-radius:8px;
  display:none;
  text-align:center;
  font-size:14px;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.dashboard{
  display:none;
}

.profile-header{
  text-align:center;
  padding-bottom:25px;
  border-bottom:1px solid #e5e7eb;
}

.profile-photo{
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #e5e7eb;
  display:none;
  margin:0 auto 12px;
}

.profile-placeholder{
  width:110px;
  height:110px;
  border-radius:50%;
  background:#eef2ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
  margin:0 auto 12px;
}

.member-id{
  display:inline-block;
  background:#eef2ff;
  color:#1d4ed8;
  padding:7px 14px;
  border-radius:20px;
  font-weight:bold;
  margin-top:8px;
}

.profile-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:25px;
}

.info{
  background:#f8fafc;
  padding:15px;
  border-radius:10px;
  border:1px solid #e5e7eb;
}

.info.full{
  grid-column:1/-1;
}

.info b{
  display:block;
  color:#374151;
  margin-bottom:5px;
  font-size:13px;
}

.info-value{
  word-break:break-word;
}

.status{
  display:inline-block;
  padding:5px 10px;
  border-radius:15px;
  background:#dcfce7;
  color:#166534;
  font-weight:bold;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:25px;
}

.action{
  padding:13px;
  border:0;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  font-size:14px;
  background:#111827;
  color:white;
  text-decoration:none;
  text-align:center;
}

.action.edit{
  background:#2563eb;
}

.action.password{
  background:#7c3aed;
}

.action.pdf{
  background:#059669;
}

.action.card{
  background:#d97706;
}

.logout{
  width:100%;
  margin-top:20px;
  padding:13px;
  border:0;
  border-radius:9px;
  background:#444;
  color:white;
  cursor:pointer;
  font-size:15px;
}

.logout:hover{
  background:#222;
}

.back-btn{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#2563eb;
  text-decoration:none;
  font-size:14px;
}

.modal{
  display:none;
  position:fixed;
  z-index:2000;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.55);
  padding:20px;
  overflow:auto;
}

.modal-box{
  max-width:650px;
  margin:40px auto;
  background:white;
  padding:25px;
  border-radius:18px;
}

.modal-box h2{
  margin-top:0;
}

.close-btn{
  float:right;
  border:0;
  background:#eee;
  width:35px;
  height:35px;
  border-radius:50%;
  cursor:pointer;
  font-size:18px;
}

.cancel-btn{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:1px solid #d1d5db;
  background:white;
  border-radius:9px;
  cursor:pointer;
}

@media(max-width:650px){

  .login-box{
    margin:10px auto;
    padding:20px;
  }

  .profile-grid{
    grid-template-columns:1fr;
  }

  .info.full{
    grid-column:auto;
  }

  .actions{
    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>

<div class="login-box">


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="loginSection">

  <div class="logo">📚</div>

  <h1>पालवी लायब्ररी</h1>

  <div class="subtitle">
    सभासद Login
  </div>

  <div class="login-form">

    <label>Member ID</label>

    <input
      type="text"
      id="loginId"
      placeholder="उदा. LIB-2026-00001"
      autocomplete="username"
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="तुमचा Password"
      autocomplete="current-password"
    >

    <button
      class="login-btn"
      id="loginButton"
      onclick="loginMember()"
    >
      Login
    </button>

    <div
      id="message"
      class="message"
    ></div>

    <a
      href="index.html"
      class="back-btn"
    >
      ← मुख्यपृष्ठावर जा
    </a>

  </div>

</div>


<!-- =====================================================
     DASHBOARD
===================================================== -->

<div id="dashboard" class="dashboard">

  <div class="profile-header">

    <div
      id="profilePlaceholder"
      class="profile-placeholder"
    >
      👤
    </div>

    <img
      id="profilePhoto"
      class="profile-photo"
      alt="Member Photo"
    >

    <h1 id="memberName">
      स्वागत आहे!
    </h1>

    <div
      id="memberId"
      class="member-id"
    ></div>

  </div>


  <div class="profile-grid">

    <div class="info">
      <b>नोंदणी दिनांक</b>
      <div id="registrationDate" class="info-value"></div>
    </div>

    <div class="info">
      <b>जन्मतारीख</b>
      <div id="dateOfBirth" class="info-value"></div>
    </div>

    <div class="info">
      <b>लिंग</b>
      <div id="gender" class="info-value"></div>
    </div>

    <div class="info">
      <b>मोबाईल क्रमांक</b>
      <div id="mobile" class="info-value"></div>
    </div>

    <div class="info">
      <b>ई-मेल</b>
      <div id="email" class="info-value"></div>
    </div>

    <div class="info">
      <b>सदस्यत्व प्रकार</b>
      <div id="membershipType" class="info-value"></div>
    </div>

    <div class="info full">
      <b>पत्रव्यवहाराचा पत्ता</b>
      <div id="correspondenceAddress" class="info-value"></div>
    </div>

    <div class="info full">
      <b>कायमचा पत्ता</b>
      <div id="permanentAddress" class="info-value"></div>
    </div>

    <div class="info">
      <b>Application Status</b>
      <div id="membershipStatus" class="status"></div>
    </div>

    <div class="info">
      <b>Account Status</b>
      <div id="accountStatus" class="status"></div>
    </div>

  </div>


  <div class="actions">

    <button
      class="action edit"
      onclick="openEditProfile()"
    >
      ✏️ Edit Profile
    </button>

    <button
      class="action password"
      onclick="openChangePassword()"
    >
      🔑 Change Password
    </button>

    <button
      class="action pdf"
      onclick="downloadMembershipPDF()"
    >
      📄 Membership PDF
    </button>

    <button
      class="action card"
      onclick="downloadLibraryCard()"
    >
      🪪 Library Card
    </button>

  </div>


  <button
    class="logout"
    onclick="logout()"
  >
    🚪 Logout
  </button>

</div>

</div>


<!-- =====================================================
     EDIT PROFILE
===================================================== -->

<div id="editModal" class="modal">

  <div class="modal-box">

    <button
      class="close-btn"
      onclick="closeModal('editModal')"
    >
      ×
    </button>

    <h2>✏️ Profile Edit करा</h2>

    <label>संपूर्ण नाव</label>

    <input
      id="editName"
      type="text"
    >

    <label>जन्मतारीख</label>

    <input
      id="editDob"
      type="date"
    >

    <label>लिंग</label>

    <select id="editGender">
      <option value="पुरुष">पुरुष</option>
      <option value="महिला">महिला</option>
      <option value="इतर">इतर</option>
    </select>

    <label>मोबाईल क्रमांक</label>

    <input
      id="editMobile"
      type="tel"
      maxlength="10"
    >

    <label>ई-मेल</label>

    <input
      id="editEmail"
      type="email"
    >

    <label>पत्रव्यवहाराचा पत्ता</label>

    <textarea id="editCorrespondence"></textarea>

    <label>कायमचा पत्ता</label>

    <textarea id="editPermanent"></textarea>

    <label>सदस्यत्व प्रकार</label>

    <select id="editMembership">

      <option value="विद्यार्थी">
        विद्यार्थी
      </option>

      <option value="सर्वसाधारण">
        सर्वसाधारण
      </option>

      <option value="ज्येष्ठ नागरिक">
        ज्येष्ठ नागरिक
      </option>

    </select>

    <button
      class="action-btn"
      onclick="saveProfile()"
    >
      Save Profile
    </button>

    <button
      class="cancel-btn"
      onclick="closeModal('editModal')"
    >
      Cancel
    </button>

    <div
      id="editMessage"
      class="message"
    ></div>

  </div>

</div>


<!-- =====================================================
     CHANGE PASSWORD
===================================================== -->

<div id="passwordModal" class="modal">

  <div class="modal-box">

    <button
      class="close-btn"
      onclick="closeModal('passwordModal')"
    >
      ×
    </button>

    <h2>🔑 Password बदला</h2>

    <label>जुना Password</label>

    <input
      id="oldPassword"
      type="password"
    >

    <label>नवीन Password</label>

    <input
      id="newPassword"
      type="password"
    >

    <label>नवीन Password पुन्हा टाका</label>

    <input
      id="confirmPassword"
      type="password"
    >

    <button
      class="action-btn"
      onclick="changePassword()"
    >
      Password Change करा
    </button>

    <button
      class="cancel-btn"
      onclick="closeModal('passwordModal')"
    >
      Cancel
    </button>

    <div
      id="passwordMessage"
      class="message"
    ></div>

  </div>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT URL
===================================================== */

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbx7O5oM9ic59fuwmXimo5cCpm9YCrMYR2LccBgA71NfAZ_pqYJAX59b5CCxKZJ-pLQp/exec";


let currentMemberId = "";
let currentProfile = null;


/* =====================================================
   LOGIN
===================================================== */

function loginMember(){

  const loginId =
    document.getElementById("loginId").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");

  const button =
    document.getElementById("loginButton");


  message.style.display = "none";


  if(!loginId || !password){

    showMessage(
      "Member ID आणि Password भरा.",
      "error"
    );

    return;
  }


  button.disabled = true;
  button.innerText = "Checking...";


  fetch(
    WEB_APP_URL,
    {
      method:"POST",

      body:new URLSearchParams({

        action:"login",

        loginId:loginId,

        password:password

      })
    }
  )

  .then(function(response){

    if(!response.ok){
      throw new Error(
        "HTTP Error " + response.status
      );
    }

    return response.json();

  })

  .then(function(result){

    button.disabled = false;
    button.innerText = "Login";


    if(result.success){

      currentMemberId =
        result.memberId;

      /*
       * LOGIN response मधूनच profile मिळतो.
       * त्यामुळे दुसरा getProfile call करण्याची
       * गरज नाही.
       */

      currentProfile = result;

      showDashboard(result);

    }
    else{

      showMessage(
        result.message ||
        "Login failed.",
        "error"
      );

    }

  })

  .catch(function(error){

    button.disabled = false;
    button.innerText = "Login";

    showMessage(
      "Server connection error. कृपया पुन्हा प्रयत्न करा.",
      "error"
    );

    console.error(error);

  });

}


/* =====================================================
   SHOW DASHBOARD
===================================================== */

function showDashboard(data){

  document.getElementById(
    "loginSection"
  ).style.display = "none";


  document.getElementById(
    "dashboard"
  ).style.display = "block";


  setText(
    "memberName",
    data.name
  );


  setText(
    "memberId",
    data.memberId
  );


  setText(
    "registrationDate",
    data.registrationDate
  );


  setText(
    "dateOfBirth",
    data.dob
  );


  setText(
    "gender",
    data.gender
  );


  setText(
    "mobile",
    data.mobile
  );


  setText(
    "email",
    data.email
  );


  setText(
    "membershipType",
    data.membershipType
  );


  setText(
    "correspondenceAddress",
    data.correspondenceAddress
  );


  setText(
    "permanentAddress",
    data.permanentAddress
  );


  setText(
    "membershipStatus",
    data.applicationStatus || "Pending"
  );


  setText(
    "accountStatus",
    data.accountStatus || "Active"
  );


  const photo =
    document.getElementById(
      "profilePhoto"
    );

  const placeholder =
    document.getElementById(
      "profilePlaceholder"
    );


  if(data.photo){

    photo.src = data.photo;

    photo.style.display = "block";

    placeholder.style.display = "none";

  }
  else{

    photo.style.display = "none";

    placeholder.style.display = "flex";

  }

}


/* =====================================================
   EDIT PROFILE
===================================================== */

function openEditProfile(){

  if(!currentProfile){
    return;
  }


  document.getElementById(
    "editName"
  ).value =
    currentProfile.name || "";


  /*
   * Google Sheet date object असल्यास
   * YYYY-MM-DD मध्ये convert करतो.
   */

  document.getElementById(
    "editDob"
  ).value =
    formatDateForInput(
      currentProfile.dob
    );


  document.getElementById(
    "editGender"
  ).value =
    currentProfile.gender || "";


  document.getElementById(
    "editMobile"
  ).value =
    currentProfile.mobile || "";


  document.getElementById(
    "editEmail"
  ).value =
    currentProfile.email || "";


  document.getElementById(
    "editCorrespondence"
  ).value =
    currentProfile.correspondenceAddress || "";


  document.getElementById(
    "editPermanent"
  ).value =
    currentProfile.permanentAddress || "";


  document.getElementById(
    "editMembership"
  ).value =
    currentProfile.membershipType || "";


  document.getElementById(
    "editModal"
  ).style.display = "block";

}


/* =====================================================
   SAVE PROFILE
===================================================== */

function saveProfile(){

  const data = {

    action:"editProfile",

    memberId:
      currentMemberId,

    fullName:
      document.getElementById(
        "editName"
      ).value.trim(),

    dateOfBirth:
      document.getElementById(
        "editDob"
      ).value,

    gender:
      document.getElementById(
        "editGender"
      ).value,

    mobile:
      document.getElementById(
        "editMobile"
      ).value.trim(),

    email:
      document.getElementById(
        "editEmail"
      ).value.trim(),

    correspondenceAddress:
      document.getElementById(
        "editCorrespondence"
      ).value.trim(),

    permanentAddress:
      document.getElementById(
        "editPermanent"
      ).value.trim(),

    membershipType:
      document.getElementById(
        "editMembership"
      ).value

  };


  fetch(
    WEB_APP_URL,
    {

      method:"POST",

      body:new URLSearchParams(data)

    }
  )

  .then(function(response){

    return response.json();

  })

  .then(function(result){

    const box =
      document.getElementById(
        "editMessage"
      );


    if(result.success){

      box.innerText =
        result.message;

      box.className =
        "message success";

      box.style.display =
        "block";


      setTimeout(function(){

        closeModal(
          "editModal"
        );

        /*
         * पुन्हा login करण्याची गरज नाही.
         * login API मधून नवीन profile घेऊ.
         */

        refreshProfile();

      },1000);

    }
    else{

      box.innerText =
        result.message;

      box.className =
        "message error";

      box.style.display =
        "block";

    }

  })

  .catch(function(error){

    console.error(error);

    showModalMessage(
      document.getElementById(
        "editMessage"
      ),
      "Server connection error.",
      "error"
    );

  });

}


/* =====================================================
   REFRESH PROFILE
===================================================== */

function refreshProfile(){

  /*
   * GET member endpoint वापरतो.
   */

  fetch(
    WEB_APP_URL +
    "?action=member&memberId=" +
    encodeURIComponent(
      currentMemberId
    )
  )

  .then(function(response){

    return response.json();

  })

  .then(function(result){

    if(result.success){

      currentProfile = result;

      showDashboard(result);

    }

  })

  .catch(function(error){

    console.error(error);

  });

}


/* =====================================================
   CHANGE PASSWORD
===================================================== */

function openChangePassword(){

  document.getElementById(
    "oldPassword"
  ).value = "";

  document.getElementById(
    "newPassword"
  ).value = "";

  document.getElementById(
    "confirmPassword"
  ).value = "";

  document.getElementById(
    "passwordMessage"
  ).style.display = "none";

  document.getElementById(
    "passwordModal"
  ).style.display = "block";

}


function changePassword(){

  const oldPassword =
    document.getElementById(
      "oldPassword"
    ).value;

  const newPassword =
    document.getElementById(
      "newPassword"
    ).value;

  const confirmPassword =
    document.getElementById(
      "confirmPassword"
    ).value;

  const message =
    document.getElementById(
      "passwordMessage"
    );


  if(
    !oldPassword ||
    !newPassword ||
    !confirmPassword
  ){

    showModalMessage(
      message,
      "सर्व Password fields भरा.",
      "error"
    );

    return;

  }


  if(newPassword.length < 4){

    showModalMessage(
      message,
      "नवीन Password किमान 4 characters असावा.",
      "error"
    );

    return;

  }


  if(newPassword !== confirmPassword){

    showModalMessage(
      message,
      "दोन्ही नवीन Password समान नाहीत.",
      "error"
    );

    return;

  }


  fetch(
    WEB_APP_URL,
    {

      method:"POST",

      body:new URLSearchParams({

        action:"changePassword",

        memberId:
          currentMemberId,

        oldPassword:
          oldPassword,

        newPassword:
          newPassword

      })

    }
  )

  .then(function(response){

    return response.json();

  })

  .then(function(result){

    if(result.success){

      showModalMessage(
        message,
        result.message,
        "success"
      );


      setTimeout(function(){

        closeModal(
          "passwordModal"
        );

      },1200);

    }
    else{

      showModalMessage(
        message,
        result.message,
        "error"
      );

    }

  })

  .catch(function(error){

    console.error(error);

    showModalMessage(
      message,
      "Server connection error.",
      "error"
    );

  });

}


/* =====================================================
   MEMBERSHIP PDF
===================================================== */

function downloadMembershipPDF(){

  if(
    currentProfile &&
    currentProfile.membershipPdf
  ){

    window.open(
      currentProfile.membershipPdf,
      "_blank"
    );

    return;

  }


  alert(
    "Membership PDF अजून तयार केलेली नाही."
  );

}


/* =====================================================
   LIBRARY CARD
===================================================== */

function downloadLibraryCard(){

  if(
    currentProfile &&
    currentProfile.libraryCard
  ){

    window.open(
      currentProfile.libraryCard,
      "_blank"
    );

    return;

  }


  alert(
    "Library Card अजून तयार केलेले नाही."
  );

}


/* =====================================================
   HELPERS
===================================================== */

function setText(id,value){

  document.getElementById(id)
    .innerText =
    value || "-";

}


function showMessage(text,type){

  const message =
    document.getElementById(
      "message"
    );

  message.innerText =
    text;

  message.className =
    "message " + type;

  message.style.display =
    "block";

}


function showModalMessage(
  element,
  text,
  type
){

  element.innerText =
    text;

  element.className =
    "message " + type;

  element.style.display =
    "block";

}


function closeModal(id){

  document.getElementById(id)
    .style.display =
    "none";

}


/* =====================================================
   DATE FORMAT
===================================================== */

function formatDateForInput(value){

  if(!value){
    return "";
  }


  if(
    typeof value === "string" &&
    /^\d{4}-\d{2}-\d{2}$/.test(value)
  ){

    return value;

  }


  const date =
    new Date(value);


  if(isNaN(date.getTime())){

    return "";

  }


  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2,"0");

  const day =
    String(
      date.getDate()
    ).padStart(2,"0");


  return (
    year +
    "-" +
    month +
    "-" +
    day
  );

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

  currentMemberId = "";

  currentProfile = null;


  document.getElementById(
    "dashboard"
  ).style.display =
    "none";


  document.getElementById(
    "loginSection"
  ).style.display =
    "block";


  document.getElementById(
    "password"
  ).value =
    "";


  document.getElementById(
    "message"
  ).style.display =
    "none";


  document.getElementById(
    "loginId"
  ).value =
    "";

}
