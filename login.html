<!DOCTYPE html>
<html lang="mr">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>सभासद Login - पालवी लायब्ररी</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:"Noto Sans Devanagari",Arial,sans-serif;
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
    135deg,
    #f8f3ed,
    #ffffff,
    #f1f5f9
  );

  padding:20px;
}

.login-box{
  width:100%;
  max-width:430px;

  background:#ffffff;

  padding:35px;

  border-radius:20px;

  box-shadow:
  0 15px 45px rgba(0,0,0,.10);

  border:1px solid #e5e7eb;
}

.logo{
  text-align:center;
  font-size:50px;
  margin-bottom:10px;
}

h1{
  text-align:center;
  font-size:27px;
  color:#111827;
  margin-bottom:6px;
}

.subtitle{
  text-align:center;
  color:#6b7280;
  font-size:14px;
  margin-bottom:30px;
}

label{
  display:block;

  margin-bottom:7px;

  font-weight:600;

  color:#374151;
}

input{
  width:100%;

  padding:13px;

  border:
  1px solid #d1d5db;

  border-radius:9px;

  margin-bottom:18px;

  font-size:15px;
}

input:focus{
  outline:none;

  border-color:#8b5e34;
}

button{
  width:100%;

  padding:13px;

  border:0;

  border-radius:9px;

  background:#8b5e34;

  color:white;

  font-size:16px;

  font-weight:700;

  cursor:pointer;
}

button:hover{
  background:#704923;
}

.back{
  text-align:center;

  margin-top:20px;
}

.back a{
  color:#8b5e34;

  text-decoration:none;

  font-weight:600;
}

</style>

</head>


<body>

<div class="login-box">

  <div class="logo">
    📚
  </div>

  <h1>
    सभासद Login
  </h1>

  <p class="subtitle">
    पालवी रूरल मोबाईल अँड डिजिटल लायब्ररी
  </p>


  <form id="loginForm">

    <label>
      Login ID
    </label>

    <input
      type="text"
      id="loginId"
      placeholder="उदा. LIB-2026-00001"
      required
    >


    <label>
      Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="आपला Password"
      required
    >


    <button type="submit">
      Login करा
    </button>

  </form>


  <div class="back">

    <a href="index.html">
      ← मुख्यपृष्ठावर जा
    </a>

  </div>

</div>

</body>

</html>
